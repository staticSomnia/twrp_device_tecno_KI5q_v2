name: Build TWRP KI5q

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            python-is-python3 openjdk-17-jdk-headless rsync bc kmod cpio libssl-dev

      - name: Configure git identity
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "GH Actions"

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init and sync manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j4 --force-sync

      - name: Copy in device tree
        run: |
          mkdir -p ~/twrp/device/tecno
          cp -r $GITHUB_WORKSPACE/device_tree ~/twrp/device/tecno/KI5q

      - name: Build
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch twrp_KI5q-eng
          mka bootimage -j$(nproc)

      - name: Diagnose image component sizes
        if: always()
        run: |
          echo "--- Kernel ---"
          ls -la ~/twrp/out/target/product/KI5q/kernel 2>/dev/null || echo "not found"
          echo "--- Ramdisk ---"
          ls -la ~/twrp/out/target/product/KI5q/ramdisk-recovery.img 2>/dev/null || echo "not found"
          echo "--- DTB ---"
          ls -la ~/twrp/device/tecno/KI5q/prebuilt/dtb.img 2>/dev/null || echo "not found"
          echo "--- recovery/root breakdown (top 20 largest) ---"
          du -ah ~/twrp/out/target/product/KI5q/recovery/root 2>/dev/null | sort -rh | head -20

      - name: Collect output images
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find ~/twrp/out/target/product/KI5q -maxdepth 1 -name "*.img" -exec cp {} $GITHUB_WORKSPACE/output/ \;
          echo "--- Collected files ---"
          ls -la $GITHUB_WORKSPACE/output
          echo "--- Full out directory, for debugging if empty above ---"
          ls -la ~/twrp/out/target/product/KI5q/ || echo "out directory doesn't exist"

      - name: Upload output image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-KI5q
          path: ${{ github.workspace }}/output/*.img
